<!-- =========================================================
     GANGA SECONDARY SCHOOL
     Shared Loading Component
     File: components/loader.html
     ========================================================= -->

<div class="site-loader"
     id="site-loader"
     role="status"
     aria-label="Loading website"
     aria-live="polite">

    <div class="loader-container">

        <!-- School Logo -->
        <div class="loader-logo"
             aria-hidden="true">

            <div class="loader-logo-ring">

                <div class="loader-logo-inner">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>

            </div>

        </div>


        <!-- School Name -->
        <div class="loader-content">

            <h1 class="loader-school-name">
                Ganga Secondary School
            </h1>

            <p class="loader-message">
                Preparing your learning experience
            </p>

        </div>


        <!-- Loading Animation -->
        <div class="loader-progress"
             aria-hidden="true">

            <span class="loader-progress-bar"></span>

        </div>


        <!-- Loading Indicator -->
        <div class="loader-spinner"
             aria-hidden="true">

            <span></span>
            <span></span>
            <span></span>

        </div>

    </div>

</div>
